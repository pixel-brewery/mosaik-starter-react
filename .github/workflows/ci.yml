name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOSAIK_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check Mosaik release consistency
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const dependencies = Object.entries({
            ...manifest.dependencies,
            ...manifest.devDependencies,
            ...manifest.optionalDependencies
          }).filter(([name]) => name.startsWith('@pixel-brewery/mosaik-'));

          assert(dependencies.length > 0, 'Expected Mosaik dependencies');
          const version = dependencies[0][1];
          assert.match(version, /^\d+\.\d+\.\d+$/, 'Pin an exact stable Mosaik version');
          for (const [name, declared] of dependencies) {
            assert.equal(declared, version, `${name} must use Mosaik ${version}`);
            assert.equal(lock.packages[`node_modules/${name}`]?.version, version, `${name} lockfile mismatch`);
          }
          for (const [path, dependency] of Object.entries(lock.packages)) {
            if (/(?:^|\/)node_modules\/@pixel-brewery\/mosaik-[^/]+$/.test(path)) {
              assert.equal(dependency.version, version, `${path} must use Mosaik ${version}`);
            }
          }
          console.log(`Mosaik ${version}: manifest and lockfile are consistent`);
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test behavior
        run: npm test
      - name: Build production application
        run: npm run build
