name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact source requested by the trusted dependency controller
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOSAIK_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - name: Test trusted dependency automation
        run: node --test .github/scripts/createDependabotAutomation.spec.mjs
      - name: Check public source and decoded archives
        run: node tools/verify-public-content.mjs
      - name: Test public-content enforcement
        run: node --test tools/verify-public-content.spec.mjs
      - name: Check Mosaik release consistency
        run: node tools/verify-mosaik-release.mjs
      - name: Test Mosaik release enforcement
        run: node --test tools/verify-mosaik-release.spec.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test behavior
        run: npm test
      - name: Build production application
        run: npm run build

  quality-gate:
    name: Quality Gate
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful application verification
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != success ]; then
            echo 'Application verification must succeed.' >&2
            exit 1
          fi
